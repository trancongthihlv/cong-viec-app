<html>
<head>
  <base target="_top">

  <!-- Responsive mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Icon -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      font-size: 24px;
    }

    /* Container */
    .app-container {
      padding-bottom: 70px; /* tránh bị footer che */
    }

    .header {
      background: #fff;
      padding: 15px;
      border-bottom: 2px solid #eee;
    }

    .h3 {
      font-size: 22px;
      font-weight:bold;
    }

    .user-info {
      display: flex;
      align-items: center;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      margin-right: 12px;
    }

    .info {
      flex: 1;
    }

    .name {
      font-weight: 600;
      font-size: 25px;
    }

    .desc {
      font-size: 20px;
      color: #6b7280;
    }

    .menu {
      font-size: 25px;
      color: #6b7280;
    }

    /* WORK TIME */
    .work-time {
      margin-top: 15px;
      background: #f3f4f6;
      border-radius: 12px;
      padding: 15px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }


    .date {
      font-size: 25px;
      font-weight: 700;
      margin-top: 5px;
    }

    .right {
      display: flex;
      align-items: center;
    }

    .time-block {
      text-align: center;
    }

    .small {
      font-size: 20px;
      color: #6b7280;
    }

    .small.vao {
      color: green;
    }

    .small.ra {
      color: #ef4444;
    }

    .time {
      font-size: 25px;
      font-weight: 700;
    }

    .divider {
      width: 1px;
      height: 30px;
      background: #d1d5db;
      margin: 0 15px;
    }

    /* BUTTON */
    .work-action {
      margin-top: 15px;
    }

    #btnAction {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: #fff;
      font-weight: 600;
      font-size:25px;
    }

    /* CONTENT */
    #content {
      padding: 10px;
    }

    /* FOOTER */
    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      border-top: 1px solid #e5e7eb;
      padding: 15px 0px;
      display: flex;
    }

    /* ITEM */
    .menu-item {
      flex: 1;
      text-align: center;
      padding-top: 10px;
      color: #9ca3af;
      cursor: pointer;
      user-select: none;
    }

    /* ICON */
    .icon {
      font-size: 25px;
      display: block;
    }

    /* LABEL */
    .label {
      font-size: 28px;
      margin-top: 4px;
      font-weight: 500;
      color: #6b7280;
    }

    /* ACTIVE */
    .menu-item.active {
      color: #111827;
    }

    .avatar-icon {
      font-size: 35px;
      color: #374151;
      background: #e5e7eb;
      border-radius: 10px;
      padding: 6px;
      margin-right: 12px;
    }

    .section {
      background: #ffffff;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-title {
      font-size: 35px;
      font-weight: 600;
      color: #1f2937;
    }

    .btn-add {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: none;
      background: #2563eb;
      color: white;
      font-size: 25px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-add:hover {
      background: #1d4ed8;
    }

    /* overlay */
    .popup {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);

      display: none;
      justify-content: center;
      align-items: center;
    }

    /* bật popup */
    .popup.show {
      display: flex;
    }

    /* box */
    .popup-box {
      background: #ffffff;
      width: 92%;
      //max-width: 420px;
      padding: 20px;
      border-radius: 16px;

      display: flex;
      flex-direction: column;
      gap: 14px;

      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    .popup {
      backdrop-filter: blur(4px);
    }

    .popup-box h3 {
      margin: 0;
      font-size: 35px;
      font-weight: 600;
      color: #111827;
    }

    .popup-box label {
      font-size: 25px;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .popup-box input,
    .popup-box select {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      font-size: 30px;
      outline: none;
      background: #f9fafb;
      transition: 0.2s;
    }

    .popup-box input:focus,
    .popup-box select:focus {
      border-color: #2563eb;
      background: #ffffff;
    }

    .popup-box button {
      padding: 12px;
      border-radius: 12px;
      font-size: 20px;
      border: none;
      cursor: pointer;
    }

    .popup-box button:first-of-type {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: white;
      font-weight: 500;
      font-size:25px;
    }

   .popup-box button:last-of-type {
      background: #f3f4f6;
      color: #374151;
      font-size:20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .preview_img{
      border: 1px solid #eee;
      object-fit: cover;
      max-height: 200px;
    }

    .task-card {
      display: flex;
      gap: 12px;
      background: #fff;
      padding: 12px;
      border-radius: 12px;
      margin-top: 10px;
      align-items: center;
      border-bottom: 1px solid #eee;
    }

    .task-stt {
      width: 40px;
      font-weight: bold;
      color: #888;
      font-size: 20px;
    }

    .task-img {
      width: 70px;
      height: 70px;
      border-radius: 10px;
      object-fit: cover;
      display: block;
    }

    .task-content {
      flex: 1;
    }

    .task-title {
      font-weight: 600;
      font-size: 25px;
    }

     .task-account {
      font-weight: 600;
      font-size: 25px;
    }

    .task-time {
      font-size: 20px;
      color: #6b7280;
    }

    .task-rating {
      font-size: 20px;
      color: #f59e0b;
    }

    .task-person {
      font-size: 20px;
      color: #666;
      margin-top: 4px;
    }

    .overview {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .overview-box {
      background: #fff;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .overview-title {
      font-size: 20px;
      color: #666;
    }

    .overview-time {
      font-size: 25px;
      font-weight: bold;
      margin-top: 5px;
    }

    .report-header {
      margin: 10px 0;
      font-size:30px;
    }

    .report-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      margin-bottom: 15px;
    }

    .report-header input[type="date"] {
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 22px;
      outline: none;
      transition: all 0.2s ease;
    }

    .report-header input[type="date"]:focus {
      border-color: #007bff;
      box-shadow: 0 0 0 2px rgba(0,123,255,0.1);
    }

    .report-header span {
      font-weight: 500;
      color: #666;
    }

    .report-header button {
      padding: 8px 14px;
      border: none;
      background: #007bff;
      color: #fff;
      border-radius: 6px;
      font-size: 22px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .report-header button:hover {
      background: #0056b3;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    .kpi-card {
      background: #fff;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .kpi-title {
      font-size: 24px;
      color: #777;
    }

    .kpi-value {
      font-size: 28px;
      font-weight: bold;
      padding-top:10px;
    }

    .quick-filter {
      display: flex;
      gap: 8px;
      
    }

    .quick-filter button {
      padding: 6px 10px;
      border: 1px solid #ddd;
      background: #ffffff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 22px;
      transition: all 0.2s;
      color:#000;
    }

    .quick-filter button:hover {
      background: #007bff;
      color: #fff;
      border-color: #007bff;
    }

     .quick-filter button:active {
      background: #007bff;
      color: #fff;
      border-color: #007bff;
    }

    .category_chart {
      margin-top: 15px;
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .cat-row {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      gap: 10px;
    }

    .cat-name {
      width: 250px;
      font-size: 28px;
    }

    .cat-bar {
      flex: 1;
      height: 10px;
      background: #eee;
      border-radius: 6px;
      overflow: hidden;
    }

    .cat-fill {
      height: 100%;
      background: linear-gradient(90deg, #007bff, #00c6ff);
      border-radius: 6px;
    }

    .cat-value {
      width: 150px;
      text-align: right;
      font-size: 28px;
    }

    .cat-count {
      font-size: 24px;
      color: #888;
    }

    .table-report {
      width: 100%;
      border-collapse: collapse;
      font-size: 24px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .table=report thead{
      border-bottom: 1px solid #777;
    }

    .table-report th {
      background: #f5f5f5;
      padding: 10px;
      text-align: left;
      font-weight: 600;
    }

    .table-report td {
      padding: 10px;
      border-bottom: 1px solid #777;
    }

    .table-report tr:hover {
      background: #fafafa;
    }

    .sub {
      font-size: 20px;
      color: #888;
    }

    .avg {
      font-weight: 600;
      color: #007bff;
    }

    .eff.good {
      color: #28a745;
      font-weight: 600;
    }

    .eff.normal {
      color: #ffc107;
    }

    .eff.bad {
      color: #dc3545;
    }

  </style>
</head>

<body>

  <div class="header">

    <!-- USER -->
    <div class="user-info">
      <span class="material-symbols-outlined avatar-icon">account_circle</span>

      <div class="info">
        <div class="name" id="ten_nv">---</div>
        <div class="desc" id="chuc_vu">---</div>
      </div>

      <div class="menu">⋮</div>
    </div>

  </div>

  <div class="app-container">

    <!-- Nội dung -->
    <div id="content">
      <!-- HOME -->
      <div id="page_home">
        <!-- WORK TIME -->
        <div class="work-time">

          <div class="left">
            <div class="label">THỜI GIAN LÀM VIỆC</div>
            <div class="date" id="ngay_lam">--/--/----</div>
            <div class="total-time" id="tong_gio">-- giờ</div>
          </div>

          <div class="right">
            <div class="time-block">
              <div class="small vao">VÀO</div>
              <div class="time" id="gio_vao">--:--</div>
            </div>

            <div class="divider"></div>

            <div class="time-block">
              <div class="small ra">RA</div>
              <div class="time" id="gio_ra">--:--</div>
            </div>
          </div>

        </div>

        <!-- BUTTON -->
        <div class="work-action">
          <button id="btnAction">ĐANG TẢI...</button>
        </div>
        <h2>Công việc</h2>
        <div id="overview" class="overview"></div>
        <div id="task_container"></div>
      </div>
      <div id="page_report" style="display:none; padding:10px;">
        <h2>Báo cáo</h2>

         <!-- FILTER -->
        <div class="report-header">

            <button onclick="setRange('last_month')">Tháng trước</button>
          </div>

          <input type="date" id="from_date">
          <span>→</span>
          <input type="date" id="to_date">
          <button onclick="loadReport()">Báo cáo</button>
        </div>

        <!-- KPI -->
        <div id="kpi_cards"></div>
        <div>
          <h3>Hạng mục</h3>
          <div id="category_chart" class="category_chart"></div>
        </div>

        <div class="report-section">
          <h3>Hoạt động hỏa táng</h3>
          <div id="cremation_table"></div>
        </div>

        <div class="report-section">
          <h3>Hoạt động khác</h3>
          <div id="other_table"></div>
        </div>

        <div class="report-section">
          <h3>Chi tiết ngày</h3>
          <div id="daily_table"></div>
        </div>

      </div>
    </div>

    <!-- Popup -->
    <div id="popup" class="popup">
        <div class="popup-box">

          <h3 id="popup_title"></h3>

          <div id="nguoi_mat_block" style="display:none;">
            <label>Người mất</label>
            <select id="ten_nguoi_mat"></select>
          </div>

          <div class="form-group">
            <label>Tên công việc</label>
            <select id="task_name"></select>
          </div>

          <div class="form-group">
            <label>Giờ bắt đầu</label>

          <div class="form-group">

            <input type="time" id="time_end">
          </div>

            <label>Tự Đánh giá</label>
            <select id="rating">
              <option value="5">★★★★★</option>
              <option value="4">★★★★</option>
              <option value="3">★★★</option>
              <option value="2">★★</option>
              <option value="1">★</option>
            </select>
          </div>

          <div class="form-group">
            <label>Hình ảnh</label>
            <input type="file" id="task_image" accept="image/*">
          </div>

          <!-- preview -->
          <img id="preview_img" class="preview_img" style="display:none; width:100%; border-radius:10px; margin-top:8px;">

          <button onclick="saveTask()">Lưu công việc</button>
            
          <button id="btn_delete" onclick="deleteTask()" style="display:none; background:red; color:#fff; font-size: 25px; font-weight:500">
            Xóa
          </button>

            <button onclick="closePopup()">Đóng</button>

        </div>
      </div>
    
  </div>

  <!-- Footer -->
  <div class="footer">

    <div class="menu-item active" data-page="home">
      <span class="material-symbols-outlined icon">calendar_month</span>
      <div class="label">HÔM NAY</div>
    </div>

    <div class="menu-item" data-page="report">
      <span class="material-symbols-outlined icon">bar_chart</span>
      <div class="label">BÁO CÁO</div>
    </div>

  </div>

  <script>
    const items = document.querySelectorAll('.menu-item');

    items.forEach(item => {
      item.addEventListener('click', () => {

        items.forEach(i => i.classList.remove('active'));
        item.classList.add('active');

        const page = item.dataset.page;

        if (page === 'home') {
          document.getElementById("page_home").style.display = "block";
          document.getElementById("page_report").style.display = "none";
        }

        let reportLoaded = false;

        if (page === 'report') {
          document.getElementById("page_home").style.display = "none";
          document.getElementById("page_report").style.display = "block";

          if (!reportLoaded) {
            setRange("today");
            reportLoaded = true;
          }
        }

      });
    });
  </script>

  <script>
      const ma_nv = '<?= ma_nv ?>';
      let btn;
      

      if (!ma_nv) {
        document.body.innerHTML = "<h3>Link không hợp lệ</h3>";
        throw new Error("Thiếu ma_nv");
      }

      function init() {

        btn = document.getElementById('btnAction');
        document.getElementById('ngay_lam').innerText = new Date().toLocaleDateString('vi-VN');
        
        btn.innerText = "ĐANG TẢI...";
        btn.disabled = true;

        // CHỈ GỌI SERVER 1 LẦN DUY NHẤT VÀO HÀM ĐÃ GỘP
        google.script.run
          .withSuccessHandler(renderAll)
          .withFailureHandler(err => {
            alert(err.message);
            btn.innerText = "LỖI TẢI DỮ LIỆU";
          })
          .api_init(ma_nv);

        google.script.run
          .withSuccessHandler(list => {
            renderDanhMuc(list);
            loadTasks(); // ✅ đúng chỗ
          })
          .getDanhMuc();

      }

      // GỘP CHUNG RENDER DATA VÀ RENDER TIME VÀO 1 HÀM
      function renderAll(data) {

        if (!data) return;

        const user = data.user || {};
        const work = data.work || {};

        // 1. nhân viên
        document.getElementById('ten_nv').innerText = user.ten_nv || "---";
        document.getElementById('chuc_vu').innerText = user.mo_ta || "---";

        // 2. giờ làm
        document.getElementById('gio_vao').innerText = work.gio_vao || "--:--";
        document.getElementById('gio_ra').innerText = work.gio_ra || "--:--";

        document.getElementById('tong_gio').innerText =
          "Thời gian: " + formatMinutes(work.gio_cong || 0);

        // 3. nút
        updateButton(work);
      }

      function updateButton(data) {
        btn.disabled = false; // Mở lại nút
        if (!data.gio_vao) {
          btn.innerText = "BẮT ĐẦU LÀM VIỆC";
          btn.onclick = startWork;
        }
        else if (!data.gio_ra) {
          btn.innerText = "KẾT THÚC";
          btn.onclick = endWork;
        }
        else {
          btn.innerText = "ĐÃ HOÀN THÀNH";
          btn.disabled = true;
        }
      }

      function startWork() {
        btn.innerText = "ĐANG XỬ LÝ...";
        btn.disabled = true;
        const time = new Date().toTimeString().slice(0,5);

        google.script.run
          .withSuccessHandler(init)
          .withFailureHandler(err => {
              alert(err.message);
              init(); // Tải lại trạng thái cũ nếu lỗi
          })
          .startWork(ma_nv, time);
      }

      function endWork() {
        btn.innerText = "ĐANG XỬ LÝ...";
        btn.disabled = true;
        const time = new Date().toTimeString().slice(0,5);

        google.script.run
          .withSuccessHandler(init)
          .withFailureHandler(err => {
              alert(err.message);
              init();
          })
          .endWork(ma_nv, time);
      }

      function formatMinutes(min) {
        const h = Math.floor(min / 60);
        const m = min % 60;

        if (h && m) return `${h}h ${m}p`;
        if (h) return `${h}h`;
        return `${m}p`;
      }

      function formatDateVN(dateStr) {
        if (!dateStr) return "";
        const d = new Date(dateStr);
        return d.toLocaleDateString("vi-VN");
      }

      function effClass(eff) {
        if (eff >= 0.8) return "good";
        if (eff >= 0.5) return "normal";
        return "bad";
      }

      function renderDanhMuc(list) {

        const container = document.getElementById("task_container");
        container.innerHTML = "";

        list.forEach(item => {

          const html = `
            <div class="section">
              <div class="section-header">
                <span class="section-title">${item.ten}</span>
                <button class="btn-add" data-id="${item.id}" data-name="${item.ten}">＋</button>
              </div>

              <div class="task-list" data-id="${item.id}"></div>
            </div>
          `;

          container.insertAdjacentHTML('beforeend', html);

        });

      }

      let currentCategoryId = "";
      let currentCategoryName = "";

      function openPopup(id, name) {

        currentCategoryId = id;
        currentCategoryName = name;

        document.getElementById("popup_title").innerText = name;

        // 🔥 RESET BUTTON
        const btn = document.querySelector(".popup-box button:first-of-type");
        btn.disabled = false;
        btn.innerText = "Lưu";
        btn.onclick = saveTask;

        // 🔥 ẨN nút xóa
        document.getElementById("btn_delete").style.display = "none";        

        // 👉 load công việc theo danh mục
        google.script.run
          .withSuccessHandler(renderCongViec)
          .getCongViecByDanhMuc(id);

        // 🔥 THÊM PHẦN NÀY
        const block = document.getElementById("nguoi_mat_block");

        if (name === "Tổ chức sự kiện" || name === "Kỹ thuật vận hành") {

          block.style.display = "block";

          google.script.run
            .withSuccessHandler(list => {renderNguoiMat(list);})
            .getDanhSachCa();

        } else {
          block.style.display = "none";
        }

        document.getElementById("popup").classList.add("show");
      }

      function closePopup() {

        document.getElementById("popup").classList.remove("show");

        // reset form
        document.getElementById("task_name").value = "";
        document.getElementById("time_start").value = "";
        document.getElementById("time_end").value = "";
        document.getElementById("rating").value = "5";
        document.getElementById("task_image").value = "";

        const img = document.getElementById("preview_img");
        img.style.display = "none";
        img.src = "";
      }

      function saveTask() {

        const btn = document.querySelector(".popup-box button:first-of-type");

        const selectNguoiMat = document.getElementById('ten_nguoi_mat');

        let ma_ht = "";
        let ten_nguoi_mat = "";

        if (currentCategoryName === "Tổ chức sự kiện" || currentCategoryName === "Kỹ thuật vận hành") {

          ten_nguoi_mat = selectNguoiMat?.value || "";

          if (selectNguoiMat && selectNguoiMat.selectedOptions.length > 0) {
            ma_ht = selectNguoiMat.selectedOptions[0].dataset.maHt || "";
          }

        }

        const data = {
          ma_nv,
          danh_muc_id: currentCategoryId,
          danh_muc_ten: currentCategoryName,
          ten_cv: document.getElementById('task_name').value.trim(),
          ma_ht,
          ten_nguoi_mat,
          gio_bd: document.getElementById('time_start').value,
          gio_kt: document.getElementById('time_end').value,
          rating: document.getElementById('rating').value
        };

        // validate
        if (!data.ten_cv || !data.gio_bd || !data.gio_kt || !data.rating) {
          alert("Vui lòng nhập đầy đủ thông tin (trừ hình ảnh)");
          return;
        }

        if (data.gio_kt <= data.gio_bd) {
          alert("Giờ kết thúc phải lớn hơn giờ bắt đầu");
          return;
        }

        btn.disabled = true;
        btn.innerText = "ĐANG LƯU...";

        const file = document.getElementById("task_image").files[0];

        if (file) {
          const reader = new FileReader();

          reader.onload = e => sendData(e.target.result, data);

          reader.onerror = () => {
            alert("Lỗi đọc file");
            btn.disabled = false;
            btn.innerText = "Lưu công việc";
          };

          reader.readAsDataURL(file);

        } else {
          sendData("", data);
        }
      }

      function sendData(imageBase64, data) {

        const btn = document.querySelector(".popup-box button:first-of-type");

        data.image = imageBase64;

        google.script.run
          .withSuccessHandler(() => {
            closePopup();
            loadTasks();

            btn.disabled = false;
            btn.innerText = "Lưu công việc";
          })
          .withFailureHandler(err => {
            alert(err.message || "Lỗi lưu dữ liệu");

            btn.disabled = false;
            btn.innerText = "Lưu công việc";
          })
          .saveTask(data);
      }


      function loadTasks() {

        google.script.run
          .withSuccessHandler(data => {
            renderTasks(data);
          })
          .getTasks(ma_nv);

      }

      function renderTasks(tasks) {

        if (!tasks || !Array.isArray(tasks)) return;

        document.querySelectorAll('.task-list')
          .forEach(el => el.innerHTML = "");

        window.taskList = tasks;

        const containers = document.querySelectorAll(".task-list");

        const sttMap = {};
        const map = {};

        // 🔥 map nhanh (ép string để chắc chắn)
        containers.forEach(el => {
          map[String(el.dataset.id)] = el;
        });

        tasks.forEach(task => {

          const key = String(task.danh_muc_id);

          sttMap[key] = (sttMap[key] || 0) + 1;
          const stt = String(sttMap[key]).padStart(2, '0');

          const img = task.image ? convertDriveUrl(task.image) : "";

          // 🔥 CHỈ HIỂN THỊ NGƯỜI MẤT CHO DM 1,2
          const isNeedNguoiMat = [1, 2].includes(Number(task.danh_muc_id));

          const html = `
            <div class="task-card">

              <div class="task-stt">${stt}</div>

              ${img ? `<img src="${img}" class="task-img"/>` : ""}

              <div class="task-content">

                <div class="task-title" data-id="${task.id}">
                  ${task.ten_cv}
                </div>

                ${
                  isNeedNguoiMat && task.ten_nguoi_mat
                    ? `<div class="task-person">👤 ${task.ten_nguoi_mat}</div>`
                    : ""
                }

                <div class="task-time">
                  ⏱ ${task.gio_bd} - ${task.gio_kt}
                  ${task.thoi_gian ? ` (${formatMinutes(task.thoi_gian)})` : ""}
                </div>

              </div>

              <div class="task-rating">⭐ ${task.rating}</div>
            </div>
          `;

          const container = map[key];

          if (container) {
            container.insertAdjacentHTML("beforeend", html);
          }

        });

        // 🔥 CHỈ GỌI 1 LẦN
        renderOverview();
      }

      document.addEventListener("click", function(e) {

        const el = e.target.closest(".task-title");
        if (!el) return;

        const id = el.dataset.id;

        editTask(id);

      });

      document.addEventListener("click", function(e) {

        const btn = e.target.closest(".btn-add");
        if (!btn) return;

        const id = btn.dataset.id;
        const name = btn.dataset.name;

        openPopup(id, name);

      });

      document.getElementById("task_image").addEventListener("change", function(e) {

        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();

        reader.onload = function(event) {
          const img = document.getElementById("preview_img");
          img.src = event.target.result;
          img.style.display = "block";
        };

        reader.readAsDataURL(file);

      });

      function renderOverview() {

        const tasks = window.taskList || [];

        const map = {
          1: { name: "Tổ chức sự kiện", minutes: 0 },
          2: { name: "Kỹ thuật vận hành", minutes: 0 },
          3: { name: "An ninh vệ sinh", minutes: 0 },
          4: { name: "Kỹ thuật bảo trì", minutes: 0 },
          5: { name: "Việc khác", minutes: 0 },
        };

        tasks.forEach(t => {

          const minutes = Number(t.thoi_gian) || 0;

          const key = Number(t.danh_muc_id);

          if (map[key]) {
            map[key].minutes += minutes;
          }

        });

        const html = Object.values(map).map(item => {

          const h = Math.floor(item.minutes / 60);
          const m = item.minutes % 60;

          return `
            <div class="overview-box">
              <div class="overview-title">${item.name}</div>
              <div class="overview-time">${h}h ${m}p</div>
            </div>
          `;
        }).join("");

        document.getElementById("overview").innerHTML = html;
      }

      function renderCongViec(list) {

        const select = document.getElementById("task_name");

        select.innerHTML = '<option value="">-- Chọn công việc --</option>';

        list.forEach(item => {
          select.innerHTML += `<option value="${item.ten}">${item.ten}</option>`;
        });

      }

      function convertDriveUrl(url) {
        if (!url) return "";

        const match = url.match(/id=([^&]+)/) || url.match(/\/d\/(.*?)\//);

        return match
          ? `https://lh3.googleusercontent.com/d/${match[1]}`
          : url;
      }

      function renderNguoiMat(list) {

        const select = document.getElementById("ten_nguoi_mat");

        select.innerHTML = '<option value="">-- Chọn --</option>';

        list.forEach(item => {

          const option = document.createElement("option");

          option.value = item.ten;                // hiển thị
          option.textContent = item.ten;

          option.dataset.maHt = item.ma_ht;      // 🔥 QUAN TRỌNG

          select.appendChild(option);
        });
      }

      

    let editingTask = null;

    async function editTask(id) {

        const task = window.taskList.find(t => t.id == id);
        if (!task) return;

        editingTask = task;

        document.getElementById("popup_title").innerText = "Chỉnh sửa công việc";

        const block = document.getElementById("nguoi_mat_block");
        const selectNguoiMat = document.getElementById("ten_nguoi_mat");
        const selectCongViec = document.getElementById("task_name");

        // 🔥 1. LOAD SONG SONG
        const [listCongViec, listNguoiMat] = await Promise.all([
          new Promise(resolve => {
            google.script.run
              .withSuccessHandler(resolve)
              .getCongViecByDanhMuc(task.danh_muc_id);
          }),
          new Promise(resolve => {
            google.script.run
              .withSuccessHandler(resolve)
              .getDanhSachCa();
          })
        ]);

        // 🔥 2. RENDER CÔNG VIỆC
        renderCongViec(listCongViec);

        // set value sau khi render
        if ([...selectCongViec.options].some(o => o.value === task.ten_cv)) {
          selectCongViec.value = task.ten_cv;
        }

        // 🔥 3. XỬ LÝ NGƯỜI MẤT
        if (task.danh_muc_ten === "Tổ chức sự kiện" || task.danh_muc_ten === "Kỹ thuật vận hành") {

          block.style.display = "block";

          renderNguoiMat(listNguoiMat);

          // set theo ma_ht (chuẩn hơn tên)
          if (task.ma_ht) {
            const target = String(task.ma_ht).trim();
            [...selectNguoiMat.options].forEach(opt => {
              const val = String(opt.dataset.maHt || "").trim();
              if (val === target) {
                selectNguoiMat.value = opt.value;
              }
            });
          }

        } else {

          block.style.display = "none";

          // 🔥 QUAN TRỌNG: RESET TRÁNH DÍNH DATA CŨ
          selectNguoiMat.innerHTML = '<option value="">-- Chọn --</option>';
          selectNguoiMat.value = "";

        }

        // 🔥 4. FILL DATA KHÁC
        document.getElementById("time_start").value = task.gio_bd || "";
        document.getElementById("time_end").value = task.gio_kt || "";
        document.getElementById("rating").value = task.rating || "5";

        // 🔥 5. BUTTON STATE
        const btn = document.querySelector(".popup-box button:first-of-type");
        btn.innerText = "Cập nhật";
        btn.onclick = updateTask;

        document.getElementById("btn_delete").style.display = "block";

        document.getElementById("popup").classList.add("show");
      }
      
      function updateTask() {

        const btn = document.querySelector(".popup-box button:first-of-type");

        const select = document.getElementById('ten_nguoi_mat');

        let ma_ht = "";
        let ten_nguoi_mat = "";

        // 🔥 CHỈ CHO DM 1,2
        if (editingTask.danh_muc_id == 1 || editingTask.danh_muc_id == 2) {

          ten_nguoi_mat = select?.value || "";

          if (select && select.selectedOptions.length > 0) {
            ma_ht = select.selectedOptions[0].dataset.maHt || "";
          }

        }

        const data = {
          ...editingTask,
          ten_cv: document.getElementById('task_name').value.trim(),
          gio_bd: document.getElementById('time_start').value,
          gio_kt: document.getElementById('time_end').value,
          rating: document.getElementById('rating').value,
          ma_ht,
          ten_nguoi_mat
        };

        // validate nhẹ
        if (!data.ten_cv || !data.gio_bd || !data.gio_kt) {
          alert("Thiếu dữ liệu");
          return;
        }

        const toMin = t => {
          const [h,m] = t.split(':').map(Number);
          return h*60 + m;
        };

        if (toMin(data.gio_kt) <= toMin(data.gio_bd)) {
          alert("Giờ kết thúc phải lớn hơn giờ bắt đầu");
          return;
        }

        btn.disabled = true;
        btn.innerText = "ĐANG CẬP NHẬT...";

        const file = document.getElementById("task_image").files[0];

        if (file) {
          const reader = new FileReader();

          reader.onload = e => sendUpdate(e.target.result, data);

          reader.onerror = () => {
            alert("Lỗi đọc file");
            btn.disabled = false;
            btn.innerText = "Cập nhật";
          };

          reader.readAsDataURL(file);

        } else {
          sendUpdate(editingTask.image, data);
        }
      }

      function sendUpdate(imageBase64, data) {

        const btn = document.querySelector(".popup-box button:first-of-type");

        data.image = imageBase64;

        google.script.run
          .withSuccessHandler(() => {
            closePopup();
            loadTasks();

            btn.disabled = false;
            btn.innerText = "Cập nhật";
          })
          .withFailureHandler(err => {
            alert(err.message || "Lỗi cập nhật");

            btn.disabled = false;
            btn.innerText = "Cập nhật";
          })
          .updateTask(data);
      }

      function deleteTask() {

        if (!confirm("Xóa công việc này?")) return;

        google.script.run
          .withSuccessHandler(() => {
            closePopup();
            loadTasks();
          })
          .deleteTask(editingTask.id);
      }

      function loadReport() {


        const from = document.getElementById("from_date").value;
        const to = document.getElementById("to_date").value;      

        if (typeof google === "undefined" || !google.script) {
          console.error("Không có google.script.run");
          return;
        }
        

        google.script.run
          .withSuccessHandler(data => {

            renderReport(data);
          })
          .withFailureHandler(err => {
            console.error("ERROR:", err);
          })
          .getReport(ma_nv, from, to);
      }

      function renderKPI(data) {

        const o = data?.overview || {};

        const html = `
          <div class="kpi-grid">

            <div class="kpi-card">
              <div class="kpi-title">Ngày công</div>
              <div class="kpi-value">${o.total_days ?? 0}</div>
            </div>

            <div class="kpi-card">
              <div class="kpi-title">Giờ công</div>
              <div class="kpi-value">${formatMinutes(o.total_work_minutes || 0)}</div>
            </div>

            <div class="kpi-card">
              <div class="kpi-title">Giờ làm</div>
              <div class="kpi-value">${formatMinutes(o.working_minutes || 0)}</div>
            </div>

            <div class="kpi-card">
              <div class="kpi-title">Công việc</div>
              <div class="kpi-value">${o.total_tasks ?? 0}</div>
            </div>

            <div class="kpi-card">
              <div class="kpi-title">Hiệu suất</div>
              <div class="kpi-value">${Math.round((o.efficiency || 0) * 100)}%</div>
            </div>

          </div>
        `;

        document.getElementById("kpi_cards").innerHTML = html;
      }

      function renderCategoryChart(categories) {

        if (!categories || !categories.length) {
          document.getElementById("category_chart").innerHTML = "<p>Không có dữ liệu</p>";
          return;
        }

        // 🔥 sort giảm dần cho đẹp
        categories.sort((a, b) => b.minutes - a.minutes);

        const max = Math.max(...categories.map(c => c.minutes));

        const html = categories.map(c => {

          const percent = (c.minutes / max) * 100;
          //const avg = c.total_tasks ? (c.minutes / c.total_tasks).toFixed(1) : 0;

          return `
            
              <div class="cat-row">
                <div class="cat-name">${c.danh_muc_ten}</div>

                <div class="cat-bar">
                  <div class="cat-fill" style="width:${percent}%"></div>
                </div>

                <div class="cat-value">
                  ${formatMinutes(c.minutes)} <br>
                  <span class="cat-count">
                    ${c.total_tasks} việc
                  </span>
                </div>
              </div>
            
          `;
        }).join("");

        document.getElementById("category_chart").innerHTML = html;
      }

      function renderCremation(cremation) {

        if (!cremation || !cremation.length) {
          document.getElementById("cremation_table").innerHTML = "Không có dữ liệu";
          return;
        }

        // 🔥 sort trước
        const sorted = [...cremation].sort((a, b) => {
          if (a.danh_muc_id !== b.danh_muc_id) {
            return a.danh_muc_id - b.danh_muc_id;
          }
          return b.avg - a.avg;
        });

        // 🔥 tính tổng số ca (tạm)
        const caseSet = new Set();
        sorted.forEach(c => {
          if (c.min_ma_ht) caseSet.add(c.min_ma_ht);
          if (c.max_ma_ht) caseSet.add(c.max_ma_ht);
        });

        const totalCases = caseSet.size;

        const html = `
          <div class="cremation-summary">
            Số ca thực hiện: <b>${totalCases}</b> ca
          </div>

          <table class="table-report">
            <thead>
              <tr>
                <th>Hạng mục</th>
                <th>Công việc</th>
                <th>Số việc</th>
                <th>Nhanh nhất</th>
                <th>Chậm nhất</th>
                <th>Trung bình</th>
              </tr>
            </thead>
            <tbody>
              ${sorted.map(c => `
                <tr>
                  <td class="category">${c.danh_muc_ten}</td>
                  <td>${c.ten_cv}</td>
                  <td>${c.total}</td>
                  <td>${formatMinutes(c.min)} <br><span class="sub">(${c.min_ma_ht || ""})</span></td>
                  <td>${formatMinutes(c.max)} <br><span class="sub">(${c.max_ma_ht || ""})</span></td>
                  <td class="avg">${formatMinutes(c.avg.toFixed(1))}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;

        document.getElementById("cremation_table").innerHTML = html;
      }

      function renderOther(other) {

        if (!other || !other.length) {
          document.getElementById("other_table").innerHTML = "Không có dữ liệu";
          return;
        }

        // 🔥 sort giống cremation
        const sorted = [...other].sort((a, b) => {
          if (a.danh_muc_id !== b.danh_muc_id) {
            return a.danh_muc_id - b.danh_muc_id;
          }
          return b.avg - a.avg;
        });

        // 🔥 tổng số việc (đúng logic)
        const totalTasks = sorted.reduce((sum, c) => sum + c.total, 0);

        const html = `
          <div class="other-summary">
            Số việc thực hiện: <b>${totalTasks}</b> việc
          </div>

          <table class="table-report">
            <thead>
              <tr>
                <th>Hạng mục</th>
                <th>Công việc</th>
                <th>Số việc</th>
                <th>Nhanh nhất</th>
                <th>Chậm nhất</th>
                <th>Trung bình</th>
              </tr>
            </thead>
            <tbody>
              ${sorted.map(c => `
                <tr>
                  <td class="category">${c.danh_muc_ten}</td>
                  <td>${c.ten_cv}</td>
                  <td>${c.total}</td>
                  <td>
                    ${formatMinutes(c.min)}
                    <div class="sub">${formatDateVN(c.min_date)}</div>
                  </td>
                  <td>
                    ${formatMinutes(c.max)}
                    <div class="sub">${formatDateVN(c.max_date)}</div>
                  </td>
                  <td class="avg">${formatMinutes(c.avg.toFixed(1))}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;

        document.getElementById("other_table").innerHTML = html;
      }

      function renderDailyDetail(daily) {

        if (!daily || !daily.length) {
          document.getElementById("daily_table").innerHTML = "Không có dữ liệu";
          return;
        }

        const html = `
          <table class="table-report">
            <thead>
              <tr>
                <th>Ngày</th>
                <th>Giờ vào</th>
                <th>Giờ ra</th>
                <th>Thời gian</th>
                <th>Số ca</th>
                <th>Số việc</th>
                <th>Giờ làm</th>
                <th>Hiệu suất</th>
              </tr>
            </thead>
            <tbody>
              ${daily.map(d => {

                const eff = (d.efficiency * 100).toFixed(0);

                return `
                  <tr>
                    <td>${d.date}</td>
                    <td>${d.gio_vao || "-"}</td>
                    <td>${d.gio_ra || "-"}</td>
                    <td>${formatMinutes(d.total_work_minutes)}</td>
                    <td>${d.total_cases}</td>
                    <td>${d.total_tasks}</td>
                    <td>${formatMinutes(d.working_minutes)}</td>
                    <td class="eff ${effClass(d.efficiency)}">${eff}%</td>
                  </tr>
                `;
              }).join("")}
            </tbody>
          </table>
        `;

        document.getElementById("daily_table").innerHTML = html;
      }

      function renderReport(data) {
        renderKPI(data);
        renderCategoryChart(data.categories);
        renderCremation(data.cremation);
        renderOther(data.other);
        renderDailyDetail(data.daily)
      }

      function formatDateInput(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, "0");
        const d = String(date.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      }

      function setRange(type) {

        const today = new Date();
        let from, to;

        switch (type) {

          case "today":
            from = to = today;
            break;

          case "yesterday":
            const y = new Date(today);
            y.setDate(y.getDate() - 1);
            from = to = y;
            break;

          case "this_month":
            from = new Date(today.getFullYear(), today.getMonth(), 1);
            to = today;
            break;

          case "last_month":
            const firstDayLastMonth = new Date(today.getFullYear(), today.getMonth() - 1, 1);
            const lastDayLastMonth = new Date(today.getFullYear(), today.getMonth(), 0);
            from = firstDayLastMonth;
            to = lastDayLastMonth;
            break;
        }

        document.getElementById("from_date").value = formatDateInput(from);
        document.getElementById("to_date").value = formatDateInput(to);

        loadReport(); // 🔥 auto load luôn
      }

      document.addEventListener("DOMContentLoaded", init);
  </script>
